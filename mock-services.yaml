---
# Create namespace for service-a (represents stage)
apiVersion: v1
kind: Namespace
metadata:
  name: service-a-ns
  labels:
    istio-injection: enabled
---
# Create namespace for service-b (represents sandbox)
apiVersion: v1
kind: Namespace
metadata:
  name: service-b-ns
  labels:
    istio-injection: enabled
---
# Create read-only client namespace
apiVersion: v1
kind: Namespace
metadata:
  name: client-readonly-ns
  labels:
    istio-injection: enabled
---
# Create write client namespace
apiVersion: v1
kind: Namespace
metadata:
  name: client-write-ns
  labels:
    istio-injection: enabled
---
# Mock service-a deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: service-a-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:latest
        args:
        - "-text=Response from SERVICE-A"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
# Service for service-a
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: service-a-ns
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: service-a
---
# Mock service-b deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: service-b-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:latest
        args:
        - "-text=Response from SERVICE-B"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
# Service for service-b
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: service-b-ns
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: service-b

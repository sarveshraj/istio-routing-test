---
# Test pod in read-only namespace
apiVersion: v1
kind: Pod
metadata:
  name: test-client-readonly
  namespace: client-readonly-ns
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
---
# Test pod in write namespace
apiVersion: v1
kind: Pod
metadata:
  name: test-client-write
  namespace: client-write-ns
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
